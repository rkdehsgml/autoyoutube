# 역할별 모델·도구·턴·예산 (docs/plan.md, docs/candidates.md).
# 모델명은 코드에 박지 않고 여기서만 바꾼다. max_budget_usd 는 Agent SDK 호출마다 넘기는 상한.
# 게시 도구(publish_*·send_naver_kit)는 tools(allowed_tools)에 절대 넣지 않는다.
# gated_tools 는 can_use_tool 이 D1 approvals 를 확인했을 때만 통과한다 (5단계).

roles:
  researcher:
    model: claude-haiku-4-5
    max_turns: 8
    max_budget_usd: 0.15
    tools: [trend_youtube, trend_naver, topic_bank, WebSearch]
  writer:
    model: claude-sonnet-5-5
    max_turns: 3
    max_budget_usd: 0.10
    tools: []                     # 스타일 가이드·플레이북은 프롬프트에 주입
  producer:
    model: claude-haiku-4-5       # TODO(decision): producer 모델 (저가 가정)
    max_turns: 20
    max_budget_usd: 1.50          # job 상한(기본 $1)이 먼저 걸린다
    tools: [tts_synthesize, stock_search, image_generate, video_generate, check_asset]
  critic:
    model: claude-haiku-4-5       # 애매하면 Sonnet 으로 재판정 (3단계)
    max_turns: 6
    max_budget_usd: 0.20
    tools: [judge_video, check_subtitles, measure_audio, ocr_frames]
  publisher:
    model: claude-haiku-4-5
    max_turns: 5
    max_budget_usd: 0.05
    tools: [request_approval]
    gated_tools: [publish_youtube, publish_instagram, send_naver_kit]
  analyst:
    model: claude-sonnet-5-5
    max_turns: 15
    max_budget_usd: 0.50
    tools: [db_query, write_report, propose_change]
